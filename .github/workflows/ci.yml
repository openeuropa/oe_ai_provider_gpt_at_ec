name: CI

on:
  pull_request:

jobs:
  drupal:
    name: Drupal ${{ matrix.drupal_core }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        drupal_core: ['^10', '^11']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start DDEV
        uses: ddev/github-action-setup-ddev@v1

      - name: Install dependencies
        run: |
          ddev core-version "${{ matrix.drupal_core }}"
          ddev symlink-project

      - name: Check coding standards
        run: ddev phpcs

      - name: Static analysis
        run: ddev phpstan

      # The tests are not symlinked into the site, see PROJECT_FILES in
      # .ddev/.env, so they are run from the repository.
      - name: Run tests
        run: ddev phpunit tests
